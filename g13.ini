; g13map bindings. Restart g13map after editing.
;
; Key names: letters, digits, F1-F12, SHIFT, CTRL, ALT, SPACE, TAB, ENTER, ESC,
; UP, DOWN, LEFT, RIGHT, HOME, END, PGUP, PGDN, INSERT, DELETE, NUM0-NUM9, and
; symbols such as - = [ ] ; ' , . /
; Combos use a plus sign, e.g. SHIFT+1. Leave a value empty for no action.
;
; Keys are sent by physical position, so symbols may differ on non-US layouts.
;
; MR toggles record mode (dark green light). Press a G-key, a stick direction (in
; wasd mode) or a stick button, and the light rolls between dark and light green.
; Then press a keyboard key or combo, and it's saved here. Record mode ends by
; itself after 30 seconds without touching the G13.

[keys]
; Top row
G1=Q
G2=W
G3=E
G4=R
G5=T
G6=Y
G7=U
; Second row
G8=8
G9=9
G10=0
G11=-
G12==
G13=Q
G14=E
; Third row
G15=R
G16=F
G17=T
G18=G
G19=Z
; Bottom row
G20=X
G21=C
G22=C
; Next to the stick
LEFT=SPACE
DOWN=TAB
STICK=
; Under the screen
BD=
L1=
L2=
L3=
L4=
; M1-M3 and the backlight button (which also toggles the light)
M1=
M2=
M3=
LIGHT=

[screen]
; Normal backlight color as red,green,blue from 0-255. Empty leaves the G13's own.
color=0,0,90
; 1 sends the toad image to the screen on connect. Off because this G13 (firmware
; 1.03) doesn't draw it: the screen only flickers.
show=0

[stick]
; wasd  = the stick sends the keys below
; analog = the stick is the left stick of a virtual Xbox 360 controller
;          (needs the ViGEmBus driver: winget install ViGEm.ViGEmBus)
mode=wasd
; Radius around center that counts as no movement in analog mode.
deadzone=12
; Keys for wasd mode
up=W
down=S
left=A
right=D
; Resting position, measured on this G13: X 121-128, Y 128-132.
center_x=125
center_y=130
; Distance from center (the full range is about 127). A direction turns on at
; press_threshold and off at release_threshold, which stops flicker at the edge.
press_threshold=50
release_threshold=40
; Set to 1 if up and down are swapped.
invert_y=0
